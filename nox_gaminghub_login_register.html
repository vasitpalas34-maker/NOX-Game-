
<script>
document.addEventListener('DOMContentLoaded', () => {
    // LOGIN AND REGISTER MODAL
    const modal = document.getElementById('authModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const tabs = document.querySelectorAll('.tab-btn');
    const forms = document.querySelectorAll('.auth-form');

    openBtn.addEventListener('click', () => {
        modal.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
        modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    });

    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            tabs.forEach(tab => tab.classList.remove('active'));
            forms.forEach(form => form.classList.remove('active'));

            btn.classList.add('active');
            document.getElementById(btn.dataset.target)
                .classList.add('active');
        });
    });

    // DEMO LOGIN AND REGISTER
    forms.forEach(form => {
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const password = form.querySelector(
                'input[type="password"]'
            );

            if (password && password.value.length < 6) {
                alert('Password must contain at least 6 characters.');
                return;
            }

            if (form.id === 'loginForm') {
                alert('Login demo successful! Real account authentication needs a backend.');
            } else {
                alert('Registration demo successful! Real account creation needs a backend.');
            }

            form.reset();
            modal.classList.remove('active');
        });
    });

    // NEON DODGE GAME
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('bestScore');
    const levelEl = document.getElementById('level');
    const messageEl = document.getElementById('gameMessage');
    const startBtn = document.getElementById('startGame');

    const player = {
        x: 365,
        y: 365,
        w: 30,
        h: 30,
        speed: 6
    };

    let blocks = [];
    let score = 0;
    let level = 1;
    let running = false;
    let gameOver = false;
    let left = false;
    let right = false;
    let lastSpawn = 0;
    let animationId = 0;
    let best = 0;

    try {
        best = Number(localStorage.getItem('noxNeonDodgeBest') || 0);
    } catch (error) {}

    bestEl.textContent = best;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(0,242,254,.12)';
        ctx.lineWidth = 1;

        for (let x = 0; x < canvas.width; x += 38) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        for (let y = 0; y < canvas.height; y += 38) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#00f2fe';
        ctx.fillRect(player.x, player.y, player.w, player.h);

        ctx.shadowColor = '#ff416c';

        blocks.forEach(block => {
            ctx.shadowBlur = 14;
            ctx.fillStyle = '#ff416c';
            ctx.fillRect(block.x, block.y, block.w, block.h);
        });

        ctx.shadowBlur = 0;

        if (!running && !gameOver) {
            ctx.fillStyle = 'rgba(5,10,20,.68)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 30px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('NEON DODGE', canvas.width / 2, 185);

            ctx.font = '16px Segoe UI';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('Press Start game', canvas.width / 2, 220);
        }
    }

    function reset() {
        cancelAnimationFrame(animationId);

        player.x = canvas.width / 2 - player.w / 2;
        blocks = [];
        score = 0;
        level = 1;
        lastSpawn = 0;

        scoreEl.textContent = score;
        levelEl.textContent = level;

        running = true;
        gameOver = false;

        messageEl.textContent = 'Good luck! Keep moving.';
        startBtn.textContent = 'Restart game';

        animationId = requestAnimationFrame(loop);
    }

    function endGame() {
        running = false;
        gameOver = true;

        if (score > best) {
            best = score;
            bestEl.textContent = best;

            try {
                localStorage.setItem('noxNeonDodgeBest', String(best));
            } catch (error) {}
        }

        messageEl.textContent =
            `Game over! Your score: ${score}. Press Restart game to try again.`;

        draw();
    }

    function loop(timestamp) {
        if (!running) return;

        if (left) player.x -= player.speed;
        if (right) player.x += player.speed;

        player.x = Math.max(
            0,
            Math.min(canvas.width - player.w, player.x)
        );

        const spawnDelay = Math.max(260, 900 - level * 55);

        if (timestamp - lastSpawn > spawnDelay) {
            const size = 18 + Math.random() * 24;

            blocks.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                w: size,
                h: size,
                speed: 2.5 + level * 0.45 + Math.random() * 1.5
            });

            lastSpawn = timestamp;
        }

        blocks.forEach(block => {
            block.y += block.speed;
        });

        blocks = blocks.filter(
            block => block.y < canvas.height + block.h
        );

        for (const block of blocks) {
            if (
                player.x < block.x + block.w &&
                player.x + player.w > block.x &&
                player.y < block.y + block.h &&
                player.y + player.h > block.y
            ) {
                endGame();
                return;
            }
        }

        score++;
        level = 1 + Math.floor(score / 500);

        scoreEl.textContent = score;
        levelEl.textContent = level;

        draw();
        animationId = requestAnimationFrame(loop);
    }

    // FIXED KEYBOARD CONTROLS
    function setKey(e, value) {
        const target = e.target;

        // Do not capture keys while typing in forms
        if (
            target.matches('input, textarea, select') ||
            target.isContentEditable
        ) {
            return;
        }

        const key = e.key.toLowerCase();

        if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(key)) {
            e.preventDefault();
        }

        if (key === 'arrowleft' || key === 'a') left = value;
        if (key === 'arrowright' || key === 'd') right = value;

        if (key === ' ' && value && !running) {
            reset();
        }
    }

    window.addEventListener('keydown', e => setKey(e, true));
    window.addEventListener('keyup', e => setKey(e, false));

    document.addEventListener('focusin', e => {
        if (e.target.matches('input, textarea, select')) {
            left = false;
            right = false;
        }
    });

    window.addEventListener('blur', () => {
        left = false;
        right = false;
    });

    startBtn.addEventListener('click', reset);

    // MOBILE GAME BUTTONS
    function holdButton(button, direction) {
        const down = e => {
            e.preventDefault();

            if (direction === 'left') left = true;
            else right = true;
        };

        const up = () => {
            if (direction === 'left') left = false;
            else right = false;
        };

        button.addEventListener('pointerdown', down);

        ['pointerup', 'pointerleave', 'pointercancel'].forEach(type => {
            button.addEventListener(type, up);
        });
    }

    holdButton(document.getElementById('leftBtn'), 'left');
    holdButton(document.getElementById('rightBtn'), 'right');

    draw();
});
</script>
